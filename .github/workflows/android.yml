name: Daparushi APKs

on:
  workflow_dispatch:
  push:
    branches: [master, codex/native-booru-rebuild]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Tests and lint
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: app/build/reports/

  apks:
    needs: checks
    # Pull requests compile without signing credentials or publication privileges.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64, universal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RULEAPP_STOREPASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RULEAPP_KEYPASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$RULEAPP_STOREPASSWORD" && test -n "$RULEAPP_KEYPASSWORD" || { echo 'Configure signing secrets before release builds.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ruleapp-release.jks"
      - name: Signed release
        env:
          RULEAPP_STOREFILE: ${{ runner.temp }}/ruleapp-release.jks
          RULEAPP_STOREPASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RULEAPP_KEYALIAS: ${{ secrets.KEY_ALIAS || 'rul34' }}
          RULEAPP_KEYPASSWORD: ${{ secrets.KEY_PASSWORD }}
          ABI: ${{ matrix.abi }}
        run: |
          bash gradlew :app:assembleRelease -PtargetAbi="$ABI" --no-daemon --max-workers=2
          version="$(tr -d '\r\n' < ver.txt)"
          if [[ "$GITHUB_REF_TYPE" == 'tag' && "$GITHUB_REF_NAME" != "v$version" ]]; then echo 'Tag must match ver.txt'; exit 1; fi
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/Daparushi-$version-$ABI.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "artifacts/Daparushi-$version-$ABI.apk"
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS-${ABI}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Daparushi-${{ matrix.abi }}
          path: artifacts/
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/ruleapp-release.jks"

  publish:
    needs: apks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Daparushi-*
          path: artifacts
          merge-multiple: true
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < ver.txt)"
          extra=()
          if [[ "$version" == *_beta ]]; then extra+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "Daparushi $version" --generate-notes "${extra[@]}"
